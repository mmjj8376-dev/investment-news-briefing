name: Test News Collector

on:
  workflow_dispatch:
  schedule:
    # 22:07 UTC = 07:07 KST (Korea has no DST, so this offset never changes).
    # Deliberately NOT on the hour -- GitHub's own docs warn that
    # top-of-the-hour is when scheduled workflows are most likely to be
    # delayed or dropped under load, since everyone else schedules there too.
    - cron: "7 22 * * *"

permissions:
  contents: read

jobs:
  run-news-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect, deduplicate, and pre-score news
        run: python src/news_collector.py

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install Copilot CLI only when a Copilot token exists
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "PERSONAL_ACCESS_TOKEN is not configured."
            echo "Skipping Copilot CLI. The zero-cost rule-based fallback will be used."
            exit 0
          fi
          npm install -g @github/copilot

      - name: Run Copilot CLI once per ticker when available
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "Copilot token not present. Keeping output/briefing.md fallback."
            exit 0
          fi

          # One combined prompt covering every ticker was too big for the
          # CLI to read in a single pass, so each ticker gets its own
          # invocation over its own small data file (see news_collector.py).
          #
          # Each ticker's output is validated on its own before it's used:
          # if Copilot returns nothing usable for a given ticker (empty,
          # truncated, auth failure, or a CLI bug that swallows the real
          # response -- this has happened), that ticker's rule-based
          # fallback section (output/fallback/{TICKER}.md) is substituted
          # in instead of leaving a blank gap. This way one bad response
          # can't blank out the whole email while the step still reports
          # success.
          : > output/copilot_briefing.md
          first=1
          while IFS= read -r ticker; do
            [ -z "$ticker" ] && continue
            echo "--- Copilot: $ticker ---"
            if [ "$first" -eq 0 ]; then
              printf '\n---\n\n' >> output/copilot_briefing.md
            fi
            first=0

            ticker_output="$(mktemp)"
            ticker_stderr="$(mktemp)"
            # Wrapped in an if/else (not a bare command) so a non-zero exit
            # from copilot does NOT kill this whole step -- GitHub Actions
            # runs bash steps with `set -e`, so an unguarded failing command
            # here would abort the loop after the very first ticker, which
            # is exactly what happened before this fix (AAPL failed, and
            # every other ticker was silently never attempted).
            if copilot -p "$(cat "output/prompts/${ticker}.txt")" -s --no-ask-user \
                 > "$ticker_output" 2> "$ticker_stderr"; then
              copilot_exit=0
            else
              copilot_exit=$?
            fi
            byte_count=$(wc -c < "$ticker_output" | tr -d ' ')

            if [ "$copilot_exit" -eq 0 ] && [ "$byte_count" -gt 80 ] && grep -qi "$ticker" "$ticker_output"; then
              cat "$ticker_output" >> output/copilot_briefing.md
            else
              echo "Copilot failed or returned nothing usable for $ticker (exit=$copilot_exit, ${byte_count} bytes) -- using rule-based fallback for this ticker." >&2
              echo "----- copilot stderr for $ticker -----" >&2
              cat "$ticker_stderr" >&2
              echo "---------------------------------------" >&2
              cat "output/fallback/${ticker}.md" >> output/copilot_briefing.md
            fi
            rm -f "$ticker_output" "$ticker_stderr"
          done < output/ticker_order.txt

          cp output/copilot_briefing.md output/briefing.md
          echo "Briefing assembled (AI per ticker where it produced usable output, rule-based fallback otherwise)."

      - name: Show final briefing
        if: always()
        run: |
          echo "===== FINAL BRIEFING ====="
          cat output/briefing.md
          echo
          cat output/briefing.md >> "$GITHUB_STEP_SUMMARY"

      - name: Get today's date (Asia/Seoul)
        if: always()
        id: kst_date
        run: echo "today=$(TZ='Asia/Seoul' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Render briefing to HTML so links are clickable
        if: always()
        run: python src/render_email_html.py

      - name: Email the briefing
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "투자 뉴스 브리핑 - ${{ steps.kst_date.outputs.today }}"
          to: mmjj8376@poba.or.kr
          from: 투자 뉴스 브리핑 <${{ secrets.GMAIL_ADDRESS }}>
          body: file://output/briefing.md
          html_body: file://output/briefing.html
